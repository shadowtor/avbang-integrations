# Used by the pre-publication history scan (see SPLIT.md). Extends the default rules.
# The values below are fake constants in unit tests; nothing else is allowed.
[extend]
useDefault = true

[[allowlists]]
description = "fake credentials used as unit test fixtures"
regexTarget = "match"
regexes = [
  '''av_live_SECRETKEY123''',
  '''tok_0123456789abcdefghij''',
  '''stash-secret-key-456''',
  '''av_live_testkey[0-9]{10}abcdef''', # an earlier spelling of the plex test key, still in history
]
