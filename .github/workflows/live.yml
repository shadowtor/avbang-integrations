name: live

# Self-test for the adapter repo. Mock mode only: no secrets, no real-API job, no package installs.
# Paths are relative to the repository root, which is the integrations/ directory of the monorepo.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Unit tests and packaging check
        run: |
          node --test test/
          node scripts/check-tree.mjs
      - name: Plex provider against a real Plex Media Server (mock API)
        run: node plex/live.mjs --mock
      - name: Stash scraper and push tool against a real Stash (mock API)
        run: |
          node stash/live-scrape.mjs --mock
          node stash/live-push.mjs --mock
      - name: Jellyfin NFO generator against real Jellyfin 12.4 and 10.11 (mock API)
        run: node jellyfin/live.mjs --mock --version all
